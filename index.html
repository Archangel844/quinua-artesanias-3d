<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Museo Digital y Marketplace 3D - Cerámica de Quinua</title>
  
  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Visor 3D y WebAR de Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

  <header>
    <h1>Museo Digital de Quinua 3D</h1>
    <div class="lang-selector">
      <button onclick="changeLanguage('qu')">Quechua</button>
      <button onclick="changeLanguage('es')">Español</button>
      <button onclick="changeLanguage('en')">English</button>
    </div>
  </header>

  <main>
    <section class="viewer-container">
      <model-viewer 
        id="quinua-viewer"
        src="assets/models/iglesia_quinua.glb" 
        ios-src="assets/models/iglesia_quinua.usdz"
        alt="Modelo 3D de la Cerámica Tradicional de Quinua"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        auto-rotate
        shadow-intensity="1">
        
        <button slot="ar-button" id="ar-button">
          👋 Ver en tu espacio (AR)
        </button>

        <button class="hotspot" slot="hotspot-1" data-position="0m 0.5m 0.2m" data-normal="0m 0m 1m">
          <div class="annotation" id="info-cruz">Cargando información...</div>
        </button>

      </model-viewer>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
